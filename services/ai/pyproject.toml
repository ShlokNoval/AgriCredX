[project]
name = "agricredx-ai"
version = "0.1.0"
description = "AI Verification Service for AgriCredX"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.23.0",
    "google-generativeai>=0.3.0",
    "supabase>=2.0.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
